name: CD Frontend

on:
  push:
    branches: ["main", "develop", "release/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-package:
    name: Validate and package once
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-fund --ignore-scripts

      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run authoritative release gate
        run: npm run release:gate

      - name: Upload immutable deploy artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  deploy-development:
    name: Promote to development
    needs: validate-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: development

    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist

      - name: Deploy exact artifact
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages-development
          force_orphan: true

  deploy-staging:
    name: Promote to staging
    needs: deploy-development
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: staging

    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist

      - name: Deploy exact artifact
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages-staging
          force_orphan: true

  deploy-production:
    name: Promote to production
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production

    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist

      - name: Deploy exact artifact
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
