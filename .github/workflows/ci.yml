name: CI Frontend

on:
  pull_request:
  push:
    branches: ["main", "develop", "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-contract:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-fund --ignore-scripts

      - name: Verify engine and repository contracts
        run: npm run engine:check && npm run repo:check

      - name: Unit compatibility
        run: npm run test:unit

  release:
    name: Authoritative release gate
    needs: node-contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-fund --ignore-scripts

      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run release gate
        run: npm run release:gate

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            coverage
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  quality-gate:
    name: Quality Gate
    needs: release
    runs-on: ubuntu-latest
    steps:
      - run: echo "All repository, quality, security, build and browser checks passed."
